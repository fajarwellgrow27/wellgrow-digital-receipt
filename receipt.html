<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tanda Terima Gaji - Wellgrow</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 520px;
    margin: auto;
    background: #fff;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
    font-size: 24px;
}

.header h2 {
    margin-top: 8px;
    font-size: 18px;
    font-weight: normal;
}

.loading {
    text-align: center;
    padding: 30px;
}

.data-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
}

.label {
    color: #666;
}

.value {
    font-weight: bold;
    text-align: right;
}

.total {
    margin-top: 20px;
    padding: 18px;
    background: #f1f1f1;
    border-radius: 10px;
    text-align: center;
}

.total-label {
    font-size: 14px;
    color: #666;
}

.total-value {
    font-size: 26px;
    font-weight: bold;
    margin-top: 5px;
}

.signature-section {
    margin-top: 30px;
}

.signature-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 10px;
}

.signature-box {
    border: 2px dashed #999;
    border-radius: 10px;
    background: #fff;
    overflow: hidden;
}

#signatureCanvas {
    display: block;
    width: 100%;
    height: 220px;
    touch-action: none;
}

.signature-note {
    font-size: 13px;
    color: #777;
    margin-top: 8px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 13px 18px;
    font-size: 15px;
    cursor: pointer;
}

.clear-button {
    background: #e5e5e5;
    color: #333;
    margin-top: 12px;
}

.submit-button {
    width: 100%;
    background: #333;
    color: #fff;
    margin-top: 15px;
}

.agreement {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    margin-top: 20px;
    font-size: 14px;
    line-height: 1.5;
}

.agreement input {
    margin-top: 4px;
    transform: scale(1.2);
}

.error {
    text-align: center;
    color: #b00020;
    padding: 25px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>WELLGROW</h1>
        <h2>TANDA TERIMA GAJI</h2>
    </div>

    <div id="loading" class="loading">
        Memuat data gaji...
    </div>

    <div id="error" class="error" style="display:none;"></div>

    <div id="data" style="display:none;">

        <div class="data-row">
            <span class="label">Nama</span>
            <span class="value" id="nama"></span>
        </div>

        <div class="data-row">
            <span class="label">NIK</span>
            <span class="value" id="nik"></span>
        </div>

        <div class="data-row">
            <span class="label">Jabatan</span>
            <span class="value" id="jabatan"></span>
        </div>

        <div class="data-row">
            <span class="label">Periode</span>
            <span class="value" id="periode"></span>
        </div>

        <br>

        <div class="data-row">
            <span class="label">Gaji Pokok</span>
            <span class="value" id="gajiPokok"></span>
        </div>

        <div class="data-row">
            <span class="label">Tunjangan</span>
            <span class="value" id="tunjangan"></span>
        </div>

        <div class="data-row">
            <span class="label">Lembur</span>
            <span class="value" id="lembur"></span>
        </div>

        <div class="data-row">
            <span class="label">Bonus</span>
            <span class="value" id="bonus"></span>
        </div>

        <div class="data-row">
            <span class="label">Potongan</span>
            <span class="value" id="potongan"></span>
        </div>

        <div class="total">
            <div class="total-label">TOTAL DITERIMA</div>
            <div class="total-value" id="totalDiterima"></div>
        </div>

        <div class="signature-section">

            <div class="signature-title">
                Tanda Tangan Karyawan
            </div>

            <div class="signature-box">
                <canvas id="signatureCanvas"></canvas>
            </div>

            <div class="signature-note">
                Silakan tanda tangan menggunakan jari di dalam kotak.
            </div>

            <button
                type="button"
                class="clear-button"
                id="clearButton">
                Hapus
            </button>

            <label class="agreement">

                <input
                    type="checkbox"
                    id="agreement">

                <span>
                    Saya menyatakan telah menerima gaji sesuai
                    dengan rincian yang tercantum di atas.
                </span>

            </label>

            <button
                type="button"
                class="submit-button"
                id="submitButton">
                KIRIM TANDA TERIMA
            </button>

        </div>

    </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxLgwrJ0BJ8KZJzzARkbL7FhIW_LsDQorI5Mbf02_ItydIhRgz6B_EopDA7ffflv77-/exec";

const token =
new URLSearchParams(window.location.search).get("id");

let employeeId = "";

let canvas = null;
let ctx = null;
let drawing = false;
let hasSignature = false;


// ==========================================
// FORMAT RUPIAH
// ==========================================

function formatRupiah(value) {

    return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
    }).format(Number(value) || 0);

}


// ==========================================
// FORMAT PERIODE
// ==========================================

function formatPeriode(value) {

    const date = new Date(value);

    return new Intl.DateTimeFormat("id-ID", {
        month: "long",
        year: "numeric",
        timeZone: "Asia/Jakarta"
    }).format(date);

}


// ==========================================
// LOAD DATA
// ==========================================

async function loadData() {

    try {

        if (!token) {
            throw new Error("Token tanda terima tidak ditemukan.");
        }

        const response = await fetch(
            API_URL + "?id=" + encodeURIComponent(token)
        );

        if (!response.ok) {
            throw new Error("Gagal menghubungi server.");
        }

        const result = await response.json();

        if (!result.success) {
            throw new Error(
                result.message || "Data tidak ditemukan."
            );
        }

        const data = result.data;

        employeeId = data.employeeId;

        document.getElementById("nama").textContent =
            data.nama;

        document.getElementById("nik").textContent =
            data.nik;

        document.getElementById("jabatan").textContent =
            data.jabatan;

        document.getElementById("periode").textContent =
            formatPeriode(data.periode);

        document.getElementById("gajiPokok").textContent =
            formatRupiah(data.gajiPokok);

        document.getElementById("tunjangan").textContent =
            formatRupiah(data.tunjangan);

        document.getElementById("lembur").textContent =
            formatRupiah(data.lembur);

        document.getElementById("bonus").textContent =
            formatRupiah(data.bonus);

        document.getElementById("potongan").textContent =
            formatRupiah(data.potongan);

        document.getElementById("totalDiterima").textContent =
            formatRupiah(data.totalDiterima);

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("data").style.display =
            "block";

        setupCanvas();

    } catch (error) {

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("error").style.display =
            "block";

        document.getElementById("error").textContent =
            error.message;

    }

}


// ==========================================
// CANVAS
// ==========================================

function setupCanvas() {

    canvas =
        document.getElementById("signatureCanvas");

    ctx =
        canvas.getContext("2d");

    resizeCanvas();

    canvas.addEventListener(
        "pointerdown",
        startDrawing
    );

    canvas.addEventListener(
        "pointermove",
        draw
    );

    canvas.addEventListener(
        "pointerup",
        stopDrawing
    );

    canvas.addEventListener(
        "pointercancel",
        stopDrawing
    );

    canvas.addEventListener(
        "pointerleave",
        stopDrawing
    );

}


// ==========================================
// RESIZE CANVAS
// ==========================================

function resizeCanvas() {

    if (!canvas) return;

    const rect =
        canvas.getBoundingClientRect();

    const ratio =
        window.devicePixelRatio || 1;

    canvas.width =
        rect.width * ratio;

    canvas.height =
        rect.height * ratio;

    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

}


// ==========================================
// POSISI POINTER
// ==========================================

function getPosition(event) {

    const rect =
        canvas.getBoundingClientRect();

    return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
    };

}


// ==========================================
// MULAI TANDA TANGAN
// ==========================================

function startDrawing(event) {

    event.preventDefault();

    drawing = true;
    hasSignature = true;

    const pos =
        getPosition(event);

    ctx.beginPath();

    ctx.moveTo(
        pos.x,
        pos.y
    );

}


// ==========================================
// GAMBAR
// ==========================================

function draw(event) {

    if (!drawing) return;

    event.preventDefault();

    const pos =
        getPosition(event);

    ctx.lineTo(
        pos.x,
        pos.y
    );

    ctx.stroke();

}


// ==========================================
// SELESAI
// ==========================================

function stopDrawing(event) {

    if (event) {
        event.preventDefault();
    }

    drawing = false;

}


// ==========================================
// HAPUS
// ==========================================

document.getElementById("clearButton")
.addEventListener("click", function() {

    if (!canvas || !ctx) return;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    hasSignature = false;

});


// ==========================================
// KIRIM TANDA TANGAN
// ==========================================

document.getElementById("submitButton")
.addEventListener("click", async function() {

    if (!hasSignature) {

        alert(
            "Silakan tanda tangan terlebih dahulu."
        );

        return;
    }

    if (
        !document.getElementById("agreement").checked
    ) {

        alert(
            "Silakan centang pernyataan penerimaan gaji."
        );

        return;
    }

    const signature =
        canvas.toDataURL("image/png");

    const button = this;

    button.disabled = true;

    button.textContent =
        "Menyimpan...";

    try {

        const response = await fetch(
            API_URL,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body: JSON.stringify({

                    token: token,

                    employeeId: employeeId,

                    signature: signature

                })
            }
        );

        const result =
            await response.json();

        if (!result.success) {

            throw new Error(
                result.message ||
                "Tanda tangan gagal disimpan."
            );

        }

        alert(
            "Tanda tangan berhasil disimpan."
        );

        button.textContent =
            "TERKIRIM ✓";

    } catch (error) {

        button.disabled = false;

        button.textContent =
            "KIRIM TANDA TERIMA";

        alert(
            "Gagal menyimpan tanda tangan:\n\n" +
            error.message
        );

    }

});


// ==========================================
// JALANKAN
// ==========================================

loadData();

</script>

</body>
</html>
