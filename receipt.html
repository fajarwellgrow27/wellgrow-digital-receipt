<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tanda Terima Gaji - Wellgrow</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 520px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .header h2 {
            margin-top: 8px;
            font-size: 18px;
            font-weight: normal;
        }

        .loading {
            text-align: center;
            padding: 30px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .label {
            color: #666;
        }

        .value {
            font-weight: bold;
            text-align: right;
        }

        .total {
            margin-top: 20px;
            padding: 18px;
            background: #f1f1f1;
            border-radius: 10px;
            text-align: center;
        }

        .total-label {
            font-size: 14px;
            color: #666;
        }

        .total-value {
            font-size: 26px;
            font-weight: bold;
            margin-top: 5px;
        }

        .signature-section {
            margin-top: 30px;
        }

        .signature-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .signature-box {
            border: 2px dashed #999;
            border-radius: 10px;
            background: #fff;
            overflow: hidden;
            width: 100%;
        }

        #signatureCanvas {
            display: block;
            width: 100%;
            height: 220px;
            touch-action: none;
            cursor: crosshair;
        }

        .signature-note {
            font-size: 13px;
            color: #777;
            margin-top: 8px;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 13px 18px;
            font-size: 15px;
            cursor: pointer;
        }

        .clear-button {
            background: #e5e5e5;
            color: #333;
        }

        .submit-button {
            flex: 1;
            background: #333;
            color: white;
        }

        .agreement {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        .agreement input {
            margin-top: 4px;
            transform: scale(1.2);
        }

        .error {
            text-align: center;
            color: #b00020;
            padding: 25px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>WELLGROW</h1>
        <h2>TANDA TERIMA GAJI</h2>
    </div>

    <div id="loading" class="loading">
        Memuat data gaji...
    </div>

    <div id="data" style="display:none;">

        <div class="data-row">
            <span class="label">Nama</span>
            <span class="value" id="nama"></span>
        </div>

        <div class="data-row">
            <span class="label">NIK</span>
            <span class="value" id="nik"></span>
        </div>

        <div class="data-row">
            <span class="label">Jabatan</span>
            <span class="value" id="jabatan"></span>
        </div>

        <div class="data-row">
            <span class="label">Periode</span>
            <span class="value" id="periode"></span>
        </div>

        <br>

        <div class="data-row">
            <span class="label">Gaji Pokok</span>
            <span class="value" id="gajiPokok"></span>
        </div>

        <div class="data-row">
            <span class="label">Tunjangan</span>
            <span class="value" id="tunjangan"></span>
        </div>

        <div class="data-row">
            <span class="label">Lembur</span>
            <span class="value" id="lembur"></span>
        </div>

        <div class="data-row">
            <span class="label">Bonus</span>
            <span class="value" id="bonus"></span>
        </div>

        <div class="data-row">
            <span class="label">Potongan</span>
            <span class="value" id="potongan"></span>
        </div>

        <div class="total">
            <div class="total-label">TOTAL DITERIMA</div>
            <div class="total-value" id="totalDiterima"></div>
        </div>

        <!-- ==========================================
             AREA TANDA TANGAN
        =========================================== -->

        <div class="signature-section">

            <div class="signature-title">
                Tanda Tangan Karyawan
            </div>

            <div class="signature-box">
                <canvas id="signatureCanvas"></canvas>
            </div>

            <div class="signature-note">
                Silakan tanda tangan menggunakan jari di dalam kotak.
            </div>

            <div class="button-row">

                <button
                    type="button"
                    class="clear-button"
                    onclick="clearSignature()">
                    Hapus
                </button>

            </div>

            <label class="agreement">

                <input
                    type="checkbox"
                    id="agreement">

                <span>
                    Saya menyatakan telah menerima gaji sesuai
                    dengan rincian yang tercantum di atas.
                </span>

            </label>

            <button
                type="button"
                class="submit-button"
                onclick="testSignature()"
                style="width:100%; margin-top:15px;">
                TEST TANDA TANGAN
            </button>

        </div>

    </div>

    <div id="error" class="error" style="display:none;"></div>

</div>


<script>

    // ==========================================
    // GOOGLE APPS SCRIPT
    // ==========================================

    const API_URL =
        "https://script.google.com/macros/s/AKfycbxLgwrJ0BJ8KZJzzARkbL7FhIW_LsDQorI5Mbf02_ItydIhRgz6B_EopDA7ffflv77-/exec";


    // ==========================================
    // TOKEN
    // ==========================================

    const params =
        new URLSearchParams(window.location.search);

    const token =
        params.get("id");
    let employeeId = "";
    

    // ==========================================
    // FORMAT RUPIAH
    // ==========================================

    function formatRupiah(angka) {

        return new Intl.NumberFormat("id-ID", {
            style: "currency",
            currency: "IDR",
            maximumFractionDigits: 0
        }).format(angka);

    }


    // ==========================================
    // FORMAT PERIODE
    // ==========================================

    function formatPeriode(tanggal) {

        const date = new Date(tanggal);

        return new Intl.DateTimeFormat("id-ID", {
            month: "long",
            year: "numeric",
            timeZone: "Asia/Jakarta"
        }).format(date);

    }


  // ==========================================
// AMBIL DATA GAJI
// ==========================================

async function loadData() {

    if (!token) {

        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "block";

        document.getElementById("error").innerText =
            "Token tanda terima tidak ditemukan.";

        return;
    }

    try {

        console.log("Memuat data token:", token);

        const response = await fetch(
            API_URL + "?id=" + encodeURIComponent(token)
        );

        if (!response.ok) {
            throw new Error("Gagal menghubungi server.");
        }

        const result = await response.json();

        console.log("Data diterima:", result);

        if (!result.success) {
            throw new Error(
                result.message || "Data tidak ditemukan."
            );
        }

        const data = result.data;

        employeeId = data.employeeId;

        document.getElementById("nama").innerText =
            data.nama;

        document.getElementById("nik").innerText =
            data.nik;

        document.getElementById("jabatan").innerText =
            data.jabatan;

        document.getElementById("periode").innerText =
            formatPeriode(data.periode);

        document.getElementById("gajiPokok").innerText =
            formatRupiah(data.gajiPokok);

        document.getElementById("tunjangan").innerText =
            formatRupiah(data.tunjangan);

        document.getElementById("lembur").innerText =
            formatRupiah(data.lembur);

        document.getElementById("bonus").innerText =
            formatRupiah(data.bonus);

        document.getElementById("potongan").innerText =
            formatRupiah(data.potongan);

        document.getElementById("totalDiterima").innerText =
            formatRupiah(data.totalDiterima);

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("data").style.display =
            "block";

        setupCanvas();

    } catch (error) {

        console.error("ERROR:", error);

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("error").style.display =
            "block";

        document.getElementById("error").innerText =
            error.message;

    }

}


// Jalankan saat halaman selesai dimuat
window.addEventListener("DOMContentLoaded", loadData);

    // ==========================================
    // CANVAS TANDA TANGAN
    // ==========================================

    let canvas;
    let ctx;
    let drawing = false;


    function setupCanvas() {

        canvas =
            document.getElementById("signatureCanvas");

        ctx =
            canvas.getContext("2d");

        resizeCanvas();

        window.addEventListener(
            "resize",
            resizeCanvas
        );


        // Mouse / komputer
        canvas.addEventListener(
            "mousedown",
            startDrawing
        );

        canvas.addEventListener(
            "mousemove",
            draw
        );

        canvas.addEventListener(
            "mouseup",
            stopDrawing
        );

        canvas.addEventListener(
            "mouseleave",
            stopDrawing
        );


        // HP / touchscreen
        canvas.addEventListener(
            "touchstart",
            startDrawing,
            { passive: false }
        );

        canvas.addEventListener(
            "touchmove",
            draw,
            { passive: false }
        );

        canvas.addEventListener(
            "touchend",
            stopDrawing,
            { passive: false }
        );

    }


    function resizeCanvas() {

        if (!canvas) return;

        const rect =
            canvas.getBoundingClientRect();

        const oldImage =
            canvas.width > 0 && canvas.height > 0
            ? canvas.toDataURL()
            : null;

        canvas.width =
            rect.width * window.devicePixelRatio;

        canvas.height =
            rect.height * window.devicePixelRatio;

        ctx.scale(
            window.devicePixelRatio,
            window.devicePixelRatio
        );

        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

    }


    function getPosition(event) {

        const rect =
            canvas.getBoundingClientRect();

        if (event.touches && event.touches.length > 0) {

            return {
                x: event.touches[0].clientX - rect.left,
                y: event.touches[0].clientY - rect.top
            };

        }

        return {
            x: event.clientX - rect.left,
            y: event.clientY - rect.top
        };

    }


    function startDrawing(event) {

        event.preventDefault();

        drawing = true;

        const pos =
            getPosition(event);

        ctx.beginPath();

        ctx.moveTo(
            pos.x,
            pos.y
        );

    }


    function draw(event) {

        if (!drawing) return;

        event.preventDefault();

        const pos =
            getPosition(event);

        ctx.lineTo(
            pos.x,
            pos.y
        );

        ctx.stroke();

    }


    function stopDrawing(event) {

        if (event) {
            event.preventDefault();
        }

        drawing = false;

    }


    // ==========================================
    // HAPUS TANDA TANGAN
    // ==========================================

    function clearSignature() {

        if (!canvas || !ctx) return;

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

    }


    // ==========================================
    // TEST SAJA
    // ==========================================

  async function testSignature() {

    if (!canvas) {
        alert("Canvas belum siap.");
        return;
    }

    const agreement =
        document.getElementById("agreement").checked;

    if (!agreement) {

        alert(
            "Silakan centang pernyataan penerimaan gaji terlebih dahulu."
        );

        return;
    }

    // Cek apakah ada tanda tangan
    const blankCanvas =
        document.createElement("canvas");

    blankCanvas.width = canvas.width;
    blankCanvas.height = canvas.height;

    if (
        canvas.toDataURL() ===
        blankCanvas.toDataURL()
    ) {

        alert(
            "Silakan tanda tangan terlebih dahulu."
        );

        return;
    }

    const signature =
        canvas.toDataURL("image/png");

    try {

        const response = await fetch(
            API_URL,
            {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify({
                    token: token,
                    employeeId: employeeId,
                    signature: signature
                })
            }
        );

        const result =
            await response.json();

        if (!result.success) {

            throw new Error(
                result.message ||
                "Gagal menyimpan tanda tangan."
            );

        }

        alert(
            "Tanda tangan berhasil disimpan ke Google Drive."
        );

    } catch (error) {

        alert(
            "Gagal menyimpan tanda tangan:\n\n" +
            error.message
        );

    }

}
